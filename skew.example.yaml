services:
  - name: api
    command: go run ./cmd/api
    cwd: .
    env:
      LOG_LEVEL: debug
    watch:
      paths: [.] # Recursively watch the service's working directory.
      ignore: [.git, node_modules, dist, build]
      debounce: 250ms

  - name: web
    command: pnpm dev
    cwd: ./web
    watch:
      paths: [src]
      ignore: [node_modules, .next]

  - name: worker
    command: go run ./cmd/worker
